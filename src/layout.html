<!doctype html>
<html lang="$lang">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 生成物: tools/build_pages.py が src/pages/$source から生成する。直接編集しないこと。 -->
  <title>$title</title>
  <meta name="description" content="$description">
$meta
  <link rel="icon" href="${root}assets/app-icon.png">
  <link rel="stylesheet" href="${root}assets/site.css?v=$css_version">
</head>
<body$body_attr>
  <header class="site-header">
    <nav class="shell nav" aria-label="$nav_label">
      <a class="brand" href="$home" aria-label="$brand_label"><img src="${root}assets/app-icon.png" alt=""><span>nyan Real Support</span></a>
      <div class="nav-links">
$nav
      </div>
      <a class="language" href="$alt_href" lang="$alt_lang">$alt_label</a>
    </nav>
  </header>

$content

  <footer class="site-footer">
    <div class="shell footer-row">
      <a class="footer-brand" href="$home">nyan Real Support</a>
      <nav class="footer-links" aria-label="$footer_label">
$footer
      </nav>
    </div>
    <div class="shell footer-meta"><p>© 2026 8796n · nyan Real</p></div>
  </footer>
</body>
</html>
